name: Build

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: Game

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up export templates
        # The image ships templates under /root, but the container runs with
        # HOME=/github/home, so Godot looks there. Copy them into place.
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
                ~/.local/share/godot/export_templates/
          ls -la ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project assets
        run: godot --headless --import

      - name: Compile-check every GDScript
        # --export-release only PACKS scripts, it never compiles them, so a
        # parse error reaches the player as a frozen game with a green CI.
        # --check-only actually compiles each script and fails the job.
        run: |
          set -e
          for f in scripts/*.gd scripts/*/*.gd tests/smoke_test.gd; do
            echo "checking $f"
            godot --headless --check-only --script "res://$f"
          done

      - name: Headless smoke test (world builds, player rests on terrain)
        # Loads the real main.tscn: if the player does not fall onto the
        # terrain, or the world is not built, [Smoke] PASS never appears.
        run: |
          godot --headless --quit-after 240 res://tests/smoke.tscn 2>&1 | tee smoke.log
          grep -q "\[Smoke\] PASS" smoke.log

      - name: Create build directories
        run: mkdir -p build/windows

      - name: Export release (Windows Desktop)
        run: godot --headless --export-release "Windows Desktop" build/windows/${EXPORT_NAME}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyrim-clone-windows
          path: build/windows/
          if-no-files-found: error
